name: JavaScript Conformance
on:
  workflow_dispatch:
    inputs:
      limit: {description: "Maximum eligible cases (0 = all)", required: true, default: "0"}
  schedule: [{cron: "41 3 * * 1"}]
permissions: {contents: read}
jobs:
  test262:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: stage}
      - name: Verify workflow mirror is in sync with stage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! cmp -s <(git show origin/main:.github/workflows/conformance.yml) .github/workflows/conformance.yml; then
            echo "FAIL: .github/workflows/conformance.yml diverges from the main-branch mirror; update both copies together" >&2
            exit 1
          fi
      - name: Reject non-legacy @pathto usage
        shell: bash
        run: |
          set -euo pipefail
          if { grep -rn "@pathto(" templates content HANDOVER.md 2>/dev/null; \
               grep -rn "@pathto(" .github 2>/dev/null | grep -v "conformance.yml"; }; then
            echo "FAIL: non-legacy @pathto( found in active dashboard sources" >&2
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {repository: minify-cx/minify, path: minify-source}
      - run: make
        working-directory: minify-source
      - run: python3 -m pip install PyYAML==6.0.3
      - run: make test && make sync
      - shell: bash
        run: |
          limit='${{ inputs.limit }}'
          if [[ -n "$limit" && "$limit" != 0 ]]; then python3 tools/conformance.py extract-js --limit "$limit"; else make extract; fi
          for shard in 0 1 2 3 4 5 6 7; do
            python3 tools/conformance.py run-js \
              --shard-count 8 --shard-index "$shard" \
              --results "results/shard-$shard.json" \
              --minify-bin "$GITHUB_WORKSPACE/minify-source/minify" \
              --timeout 30
          done
          python3 tools/conformance.py combine results/shard-{0..7}.json
      - name: Build and verify static dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker="$(date +%s)"
          # Check out the publication tree (main) into public.
          rm -rf public
          git clone --quiet --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" public
          # Build the pinned Nift 4.0.12 candidate that supports canonical @path.
          git clone --quiet https://github.com/nift-dev/nift.git nift-candidate
          git -C nift-candidate checkout --quiet 77e44d15e43f0936876107c4df1fa6a5b8220be4
          make -C nift-candidate -j2 >/dev/null
          test "$(nift-candidate/nift --version)" = "Nift v4.0.12" \
            || { echo "FAIL: candidate Nift version is not v4.0.12" >&2; exit 1; }
          export PATH="$PWD/nift-candidate:$PATH"
          # Invoke the dashboard command (the harness verifies the output).
          python3 tools/conformance.py dashboard --results results/latest.json
          test "$(stat -c %Y public/index.html)" -ge "$marker" \
            || { echo "FAIL: public/index.html was not freshly built" >&2; exit 1; }
          test "$(stat -c %Y public/results/latest.json)" -ge "$marker" \
            || { echo "FAIL: public/results/latest.json was not freshly produced" >&2; exit 1; }
          echo "dashboard built and verified"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: javascript-conformance-results
          path: |
            results/
            public/